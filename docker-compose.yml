services:
  searxng:
    image: searxng/searxng:latest
    container_name: local-assistant-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: local-assistant-development-only
      SEARXNG_LIMITER: "false"
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./config/searxng:/etc/searxng
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--proxy=off", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

