application:
  name: "A.M.I.G.O."
  wake_phrase: "Hey Amigo"
  lightweight_ram_threshold_gb: 8
  max_concurrent_tools: 2
  conversation_history_limit: 12

filesystem:
  access: "os_permissions"
  default_directory: "~"
  create_missing_parents: true
  max_text_file_size: 2097152

execution:
  approval: "administrator_only"
  command_timeout_seconds: 120

web:
  searxng_url: "http://localhost:8080"
  timeout_seconds: 10
  max_response_size: 2097152
  max_search_results: 10

llm:
  provider: "groq"
  groq_model: "llama-3.3-70b-versatile"
  groq_stt_model: "whisper-large-v3-turbo"
  groq_tts_model: "canopylabs/orpheus-v1-english"
  groq_tts_voice: "troy"
  groq_timeout_seconds: 60
  groq_max_retries: 1
  max_agent_tool_steps: 6
  ollama_model: ""

voice:
  enabled: true
  output_enabled: true
  input_format: "pcm_s16le_16000_mono"
